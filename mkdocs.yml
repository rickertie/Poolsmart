site_name: PoolSmart
site_description: Intelligent swimming pool controller for Home Assistant
site_url: https://rickertie.github.io/Poolsmart/
repo_url: https://github.com/rickertie/Poolsmart
edit_uri: edit/main/docs/
copyright: PoolSmart is licensed under AGPL-3.0-or-later

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: cyan
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

exclude_docs: |
  .AI_RECOMMENDATIONS/
  promotion/
  images/README.md
  brand-image.md
  community_post.md

nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - Core Concepts:
      - Architecture: architecture.md
      - Planning & Prices: planning.md
      - Self-Learning: learning.md
  - Subsystems:
      - Filtration: filtration.md
      - Heating: heating.md
      - Water Chemistry: chemistry.md
  - Setup & Configuration:
      - Hardware & Wiring: hardware.md
      - ESPHome: esphome.md
      - Sensors & Calibration: sensors.md
      - Configuration: configuration.md
      - Wizard Defaults: defaults.md
  - Reference:
      - Entities: entities.md
      - Management Panel: panel.md
      - Lovelace Dashboards: lovelace/README.md
      - Logging & Diagnostics: logging.md
      - Troubleshooting: troubleshooting.md
      - Development: development.md
      - ESPHome Example YAML: esphome/pool_sensors.yaml
  - Changelog: https://github.com/rickertie/Poolsmart/blob/main/CHANGELOG.md
