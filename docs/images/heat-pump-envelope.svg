<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" role="img" aria-labelledby="t d"><title id="t">Heat pump operating envelope</title><desc id="d">Outdoor temperature below the configured minimum disables heating; circulation can continue for frost protection.</desc><rect x="1" y="1" width="878" height="268" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/><text x="42" y="48" font-family="sans-serif" font-size="21" font-weight="700" fill="#0f172a">Heat pump operating envelope</text><text x="42" y="83" font-family="sans-serif" font-size="13" fill="#475569">Outdoor temperature gate</text><rect x="48" y="116" width="784" height="40" rx="8" fill="#e2e8f0"/><path d="M320 116h512v40H320z" fill="#bfdbfe"/><path d="M320 116v40" stroke="#2563eb" stroke-width="3"/><text x="175" y="142" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#334155">Below minimum</text><text x="572" y="142" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e40af">Operating range</text><path d="M320 109v-17h-91" fill="none" stroke="#64748b" stroke-width="1.5"/><text x="221" y="87" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">Configured minimum</text><rect x="48" y="184" width="360" height="48" rx="8" fill="#fff7ed" stroke="#fed7aa"/><text x="228" y="204" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#9a3412">Below limit</text><text x="228" y="221" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#7c2d12">Heating disabled; circulation may protect from frost</text><rect x="432" y="184" width="400" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe"/><text x="632" y="204" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1e40af">Within range</text><text x="632" y="221" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">Heating can be considered by the decision ladder</text></svg>
