    <g filter="url(#d1-shadow)">
      <rect x="660" y="20" width="140" height="42" rx="8" fill="#FFFFFF" stroke="#4CAF50" stroke-width="1.5"/>
      <text x="730" y="46" font-size="10" fill="#455A64" text-anchor="middle">Heat loss learned,</text>
      <text x="730" y="58" font-size="10" fill="#455A64" text-anchor="middle">timing tightens up</text>
    </g>
  </g>

  <g transform="translate(50, 200)">
    <rect x="0" y="0" width="720" height="20" rx="4" ry="4" fill="#FFF3E0"/>
    <text x="360" y="14" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" fill="#E65100" text-anchor="middle">Placeholder — see VISUAL_ASSETS_RECOMMENDATIONS.md for AI generation prompt</text>
