<!-- PLACEHOLDER SVG — Replace with AI-generated image from VISUAL_ASSETS_RECOMMENDATIONS.md -->
<svg
   version="1.1"
   id="svg-day-one-timeline"
   width="820"
   height="230"
   viewBox="0 0 820 230"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">

  <title>What to Expect on Day One — Placeholder</title>
  <desc>Horizontal timeline: first 30 seconds, first hour, first day, first week, first month. See VISUAL_ASSETS_RECOMMENDATIONS.md for AI generation prompt.</desc>

  <defs>
    <filter id="d1-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="820" height="230" fill="#FAFAFA"/>

  <!-- baseline -->
  <line x1="60" y1="90" x2="760" y2="90" stroke="#B0BEC5" stroke-width="3"/>

  <g font-family="Inter, Roboto, system-ui, sans-serif">
    <!-- 30 seconds -->
    <circle cx="90" cy="90" r="9" fill="#00ACC1"/>
    <text x="90" y="130" font-size="12" font-weight="700" fill="#37474F" text-anchor="middle">30 seconds</text>
    <text x="90" y="148" font-size="10" fill="#78909C" text-anchor="middle">First decision</text>
    <g filter="url(#d1-shadow)">
      <rect x="20" y="20" width="140" height="42" rx="8" fill="#FFFFFF" stroke="#00ACC1" stroke-width="1.5"/>
      <text x="90" y="46" font-size="10" fill="#455A64" text-anchor="middle">Pool state evaluated,</text>
      <text x="90" y="58" font-size="10" fill="#455A64" text-anchor="middle">branch chosen</text>
    </g>

    <!-- 1 hour -->
    <circle cx="255" cy="90" r="9" fill="#03A9F4"/>
    <text x="255" y="130" font-size="12" font-weight="700" fill="#37474F" text-anchor="middle">First hour</text>
    <text x="255" y="148" font-size="10" fill="#78909C" text-anchor="middle">Pump follows schedule</text>
    <g filter="url(#d1-shadow)">
      <rect x="185" y="20" width="140" height="42" rx="8" fill="#FFFFFF" stroke="#03A9F4" stroke-width="1.5"/>
      <text x="255" y="46" font-size="10" fill="#455A64" text-anchor="middle">Pump on/off per</text>
      <text x="255" y="58" font-size="10" fill="#455A64" text-anchor="middle">filtration block</text>
    </g>

    <!-- 1 day -->
    <circle cx="420" cy="90" r="9" fill="#FF9800"/>
    <text x="420" y="130" font-size="12" font-weight="700" fill="#37474F" text-anchor="middle">First day</text>
    <text x="420" y="148" font-size="10" fill="#78909C" text-anchor="middle">Status reflects demand</text>
    <g filter="url(#d1-shadow)">
      <rect x="350" y="20" width="140" height="42" rx="8" fill="#FFFFFF" stroke="#FF9800" stroke-width="1.5"/>
      <text x="420" y="46" font-size="10" fill="#455A64" text-anchor="middle">Daily filtration block,</text>
      <text x="420" y="58" font-size="10" fill="#455A64" text-anchor="middle">any heating demand</text>
    </g>

    <!-- 1 week -->
    <circle cx="585" cy="90" r="9" fill="#9C27B0"/>
    <text x="585" y="130" font-size="12" font-weight="700" fill="#37474F" text-anchor="middle">First week</text>
    <text x="585" y="148" font-size="10" fill="#78909C" text-anchor="middle">Learning begins</text>
    <g filter="url(#d1-shadow)">
      <rect x="515" y="20" width="140" height="42" rx="8" fill="#FFFFFF" stroke="#9C27B0" stroke-width="1.5"/>
      <text x="585" y="46" font-size="10" fill="#455A64" text-anchor="middle">Session data collected</text>
      <text x="585" y="58" font-size="10" fill="#455A64" text-anchor="middle">per heating cycle</text>
    </g>

    <!-- 1 month -->
    <circle cx="730" cy="90" r="9" fill="#4CAF50"/>
    <text x="730" y="130" font-size="12" font-weight="700" fill="#37474F" text-anchor="middle">First month</text>
