<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- PLACEHOLDER SVG — Replace with AI-generated image from VISUAL_ASSETS_RECOMMENDATIONS.md -->
<svg
   version="1.1"
   id="svg-bucket-test"
   width="800"
   height="500"
   viewBox="0 0 800 500"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">

  <title>Flow Meter Calibration (Bucket Test) — Placeholder</title>
  <desc>Placeholder diagram showing bucket test procedure for calibrating a flow meter. See VISUAL_ASSETS_RECOMMENDATIONS.md for AI generation prompt.</desc>

  <defs>
    <!-- Water gradient -->
    <linearGradient id="water-fill" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#03A9F4;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#00ACC1;stop-opacity:0.3" />
    </linearGradient>
    <!-- Bucket gradient -->
    <linearGradient id="bucket-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#CFD8DC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B0BEC5;stop-opacity:1" />
    </linearGradient>
    <!-- Metal gradient for hose -->
    <linearGradient id="hose-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ECEFF1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B0BEC5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#78909C;stop-opacity:1" />
    </linearGradient>
    <!-- Card shadow -->
    <filter id="diagram-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
    <!-- Arrow marker -->
    <marker id="flow-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#03A9F4"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="8" ry="8" fill="#FAFAFA"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="800" height="72" rx="8" ry="8" fill="#00ACC1"/>
  <rect x="0" y="48" width="800" height="24" fill="#00ACC1"/>

  <!-- Title -->
  <text x="40" y="46" font-family="Inter, Roboto, system-ui, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Flow Meter Calibration (Bucket Test)</text>

  <!-- Subtitle -->
  <text x="40" y="100" font-family="Inter, Roboto, system-ui, sans-serif" font-size="14" fill="#616161">Measuring exactly 10 liters of water</text>

  <!-- === POOL RETURN JETS (left side) === -->
  <g transform="translate(40, 130)" filter="url(#diagram-shadow)">
    <!-- Pool wall -->
    <rect x="0" y="0" width="100" height="260" rx="6" ry="6" fill="#E3F2FD" stroke="#03A9F4" stroke-width="2"/>
    <!-- Return jet -->
    <circle cx="50" cy="80" r="18" fill="#03A9F4" opacity="0.8"/>
    <circle cx="50" cy="80" r="10" fill="#FFFFFF" opacity="0.9"/>
    <text x="50" y="85" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" font-weight="700" fill="#03A9F4" text-anchor="middle">JET</text>
    <!-- Water flow animation arrows -->
    <path d="M 68 80 L 90 80" stroke="#03A9F4" stroke-width="2" marker-end="url(#flow-arrow)" stroke-dasharray="6,4"/>
    <!-- Pool label -->
    <text x="50" y="230" font-family="Inter, Roboto, system-ui, sans-serif" font-size="11" font-weight="600" fill="#03A9F4" text-anchor="middle">Pool Return</text>
  </g>

  <!-- === HOSE (center) === -->
  <g transform="translate(140, 180)">
    <!-- Hose body -->
    <path d="M 0 30 Q 60 10 120 30 Q 180 50 240 30" stroke="url(#hose-metal)" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- Hose highlight -->
    <path d="M 0 30 Q 60 10 120 30 Q 180 50 240 30" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.4"/>
    <!-- Flow direction arrows -->
    <path d="M 40 28 L 60 28" stroke="#00ACC1" stroke-width="2" marker-end="url(#flow-arrow)"/>
    <path d="M 100 28 L 120 28" stroke="#00ACC1" stroke-width="2" marker-end="url(#flow-arrow)"/>
    <path d="M 160 28 L 180 28" stroke="#00ACC1" stroke-width="2" marker-end="url(#flow-arrow)"/>
    <path d="M 220 28 L 240 28" stroke="#00ACC1" stroke-width="2" marker-end="url(#flow-arrow)"/>
  </g>

  <!-- === BUCKET (right side) === -->
  <g transform="translate(420, 150)" filter="url(#diagram-shadow)">
    <!-- Bucket body (trapezoid shape) -->
    <path d="M 10 0 L 230 0 L 210 240 L 30 240 Z" fill="url(#bucket-body)" stroke="#78909C" stroke-width="2"/>
    <!-- Water inside bucket -->
    <path d="M 34 60 L 206 60 L 190 230 L 48 230 Z" fill="url(#water-fill)"/>
    <!-- 10L mark line -->
    <line x1="28" y1="70" x2="212" y2="70" stroke="#F44336" stroke-width="2" stroke-dasharray="6,3"/>
    <!-- 10L label -->
    <text x="240" y="75" font-family="Inter, Roboto, system-ui, sans-serif" font-size="11" font-weight="700" fill="#F44336">10L</text>
    <!-- Measurement lines -->
    <line x1="26" y1="110" x2="40" y2="110" stroke="#9E9E9E" stroke-width="1"/>
    <line x1="26" y1="150" x2="40" y2="150" stroke="#9E9E9E" stroke-width="1"/>
    <line x1="26" y1="190" x2="40" y2="190" stroke="#9E9E9E" stroke-width="1"/>
    <!-- Bucket rim -->
    <ellipse cx="120" cy="0" rx="110" ry="10" fill="#CFD8DC" stroke="#78909C" stroke-width="2"/>
    <!-- Bucket handle -->
    <path d="M 50 -5 Q 120 -50 190 -5" stroke="#78909C" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Bucket label -->
    <text x="120" y="270" font-family="Inter, Roboto, system-ui, sans-serif" font-size="11" font-weight="600" fill="#546E7A" text-anchor="middle">Measuring Bucket</text>
    <!-- Water level wave -->
    <path d="M 34 60 Q 60 55 90 60 Q 120 65 150 60 Q 180 55 206 60" stroke="#03A9F4" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>

  <!-- === INSTRUCTION STEPS (bottom) === -->
  <g transform="translate(40, 410)">
    <!-- Step 1 -->
    <circle cx="16" cy="16" r="16" fill="#00ACC1"/>
    <text x="16" y="21" font-family="Inter, Roboto, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="40" y="21" font-family="Inter, Roboto, system-ui, sans-serif" font-size="11" fill="#37474F">Run pump and direct return flow into bucket</text>

    <!-- Step 2 -->
    <circle cx="16" cy="46" r="16" fill="#03A9F4"/>
    <text x="16" y="51" font-family="Inter, Roboto, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="40" y="51" font-family="Inter, Roboto, system-ui, sans-serif" font-size="11" fill="#37474F">Time how long it takes to reach exactly 10L</text>

    <!-- Step 3 -->
    <circle cx="16" cy="76" r="16" fill="#4CAF50"/>
    <text x="16" y="81" font-family="Inter, Roboto, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="40" y="81" font-family="Inter, Roboto, system-ui, sans-serif" font-size="11" fill="#37474F">Calculate: Flow (L/min) = 600 ÷ seconds</text>
  </g>

  <!-- Formula box -->
  <g transform="translate(500, 420)">
    <rect x="0" y="0" width="260" height="50" rx="8" ry="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1" stroke-opacity="0.4"/>
    <text x="130" y="22" font-family="Inter, Roboto, system-ui, sans-serif" font-size="11" font-weight="600" fill="#2E7D32" text-anchor="middle">Flow Rate Formula</text>
    <text x="130" y="42" font-family="JetBrains Mono, 'Courier New', monospace" font-size="14" font-weight="700" fill="#1B5E20" text-anchor="middle">L/min = 600 / time(s)</text>
  </g>

  <!-- Water drop decorations -->
  <g transform="translate(155, 160)" opacity="0.5">
    <circle cx="0" cy="0" r="4" fill="#03A9F4"/>
    <circle cx="20" cy="5" r="3" fill="#03A9F4"/>
    <circle cx="40" cy="2" r="4" fill="#03A9F4"/>
    <circle cx="60" cy="6" r="3" fill="#03A9F4"/>
  </g>

  <!-- Footer -->
  <g transform="translate(40, 475)">
    <rect x="0" y="0" width="720" height="20" rx="4" ry="4" fill="#FFF3E0"/>
    <text x="360" y="14" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" fill="#E65100" text-anchor="middle">Placeholder — see VISUAL_ASSETS_RECOMMENDATIONS.md for AI generation prompt</text>
  </g>

</svg>
