<svg xmlns="http://www.w3.org/2000/svg" width="2816" height="1536" viewBox="0 0 1408 768" role="img" aria-labelledby="title desc">
  <title id="title">Poolsmart control priority ladder</title>
  <desc id="desc">Rules are checked from highest to lowest priority. The first matching rule wins.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef3f8"/></linearGradient>
    <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#20b8e8"/><stop offset="1" stop-color="#1688d4"/></linearGradient>
    <linearGradient id="green" x2="1" y2="1"><stop stop-color="#61c879"/><stop offset="1" stop-color="#36a85b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto"><path d="M1 1L9 6 1 11" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#18212f}.title{font-size:35px;font-weight:700;letter-spacing:-.6px}.sub{font-size:17px;fill:#64748b}.row{font-size:20px;font-weight:600}.num{font-size:18px;font-weight:700}.small{font-size:14px;fill:#64748b}.tag{font-size:12px;font-weight:700;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1408" height="768" fill="url(#bg)"/>
  <circle cx="1280" cy="96" r="180" fill="#dff4ff" opacity=".42"/><circle cx="92" cy="700" r="180" fill="#e4f7ea" opacity=".48"/>

  <text x="84" y="76" class="title">Control priority</text>
  <text x="84" y="108" class="sub">Rules are evaluated from top to bottom. The first matching rule takes control.</text>
  <rect x="1090" y="54" width="236" height="46" rx="23" fill="#fff" filter="url(#shadow)"/>
  <circle cx="1117" cy="77" r="7" fill="#22a95b"/><text x="1134" y="82" class="tag" fill="#334155">FIRST MATCH WINS</text>

  <text x="85" y="154" class="tag" fill="#94a3b8">HIGHEST PRIORITY</text>
  <path d="M105 176V695" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="144" y="137" width="830" height="52" rx="16" fill="#fff"/><rect x="144" y="137" width="9" height="52" rx="4" fill="#e65c5c"/>
    <rect x="144" y="197" width="830" height="52" rx="16" fill="#fff"/><rect x="144" y="197" width="9" height="52" rx="4" fill="#e65c5c"/>
    <rect x="144" y="257" width="830" height="52" rx="16" fill="#fff"/><rect x="144" y="257" width="9" height="52" rx="4" fill="#f59e0b"/>
    <rect x="144" y="317" width="830" height="52" rx="16" fill="#fff"/><rect x="144" y="317" width="9" height="52" rx="4" fill="#f59e0b"/>
    <rect x="144" y="377" width="830" height="52" rx="16" fill="#fff"/><rect x="144" y="377" width="9" height="52" rx="4" fill="#169bd5"/>
    <rect x="144" y="437" width="830" height="52" rx="16" fill="#fff"/><rect x="144" y="437" width="9" height="52" rx="4" fill="#169bd5"/>
    <rect x="144" y="497" width="830" height="52" rx="16" fill="#fff"/><rect x="144" y="497" width="9" height="52" rx="4" fill="#45b765"/>
    <rect x="144" y="557" width="830" height="52" rx="16" fill="#fff"/><rect x="144" y="557" width="9" height="52" rx="4" fill="#45b765"/>
    <rect x="144" y="617" width="830" height="52" rx="16" fill="#fff"/><rect x="144" y="617" width="9" height="52" rx="4" fill="#94a3b8"/>
    <rect x="144" y="677" width="830" height="52" rx="16" fill="#fff"/><rect x="144" y="677" width="9" height="52" rx="4" fill="#94a3b8"/>
  </g>
  <g>
    <g><circle cx="184" cy="163" r="15" fill="#fee2e2"/><text x="184" y="169" text-anchor="middle" class="num" fill="#c24141">0</text><text x="220" y="170" class="row">Emergency stop</text><text x="930" y="169" text-anchor="end" class="small">SAFETY</text></g>
    <g><circle cx="184" cy="223" r="15" fill="#fee2e2"/><text x="184" y="229" text-anchor="middle" class="num" fill="#c24141">1</text><text x="220" y="230" class="row">Frost protection</text><text x="930" y="229" text-anchor="end" class="small">SAFETY</text></g>
    <g><circle cx="184" cy="283" r="15" fill="#ffedd5"/><text x="184" y="289" text-anchor="middle" class="num" fill="#c24141">2</text><text x="220" y="290" class="row">Manual override</text><text x="930" y="289" text-anchor="end" class="small">USER CONTROL</text></g>
    <g><circle cx="184" cy="343" r="15" fill="#ffedd5"/><text x="184" y="349" text-anchor="middle" class="num" fill="#c24141">3</text><text x="220" y="350" class="row">Chemistry cycle</text><text x="930" y="349" text-anchor="end" class="small">WATER CARE</text></g>
    <g><circle cx="184" cy="403" r="15" fill="#dff4ff"/><text x="184" y="409" text-anchor="middle" class="num" fill="#087cab">4</text><text x="220" y="410" class="row">Filtration deadline</text><text x="930" y="409" text-anchor="end" class="small">FILTRATION</text></g>
    <g><circle cx="184" cy="463" r="15" fill="#dff4ff"/><text x="184" y="469" text-anchor="middle" class="num" fill="#087cab">5</text><text x="220" y="470" class="row">Free electricity</text><text x="930" y="469" text-anchor="end" class="small">SOLAR SURPLUS</text></g>
    <g><circle cx="184" cy="523" r="15" fill="#dcfce7"/><text x="184" y="529" text-anchor="middle" class="num" fill="#218344">6</text><text x="220" y="530" class="row">Heating session</text><text x="930" y="529" text-anchor="end" class="small">HEATING</text></g>
    <g><circle cx="184" cy="583" r="15" fill="#dcfce7"/><text x="184" y="589" text-anchor="middle" class="num" fill="#218344">7</text><text x="220" y="590" class="row">Scheduled filtration</text><text x="930" y="589" text-anchor="end" class="small">FILTRATION</text></g>
    <g><circle cx="184" cy="643" r="15" fill="#e2e8f0"/><text x="184" y="649" text-anchor="middle" class="num" fill="#475569">8</text><text x="220" y="650" class="row">Pump rundown</text><text x="930" y="649" text-anchor="end" class="small">SHUTDOWN</text></g>
    <g><circle cx="184" cy="703" r="15" fill="#e2e8f0"/><text x="184" y="709" text-anchor="middle" class="num" fill="#475569">9</text><text x="220" y="710" class="row">Idle</text><text x="930" y="709" text-anchor="end" class="small">LOWEST PRIORITY</text></g>
  </g>

  <g filter="url(#shadow)">
    <rect x="1020" y="224" width="306" height="134" rx="24" fill="url(#blue)"/>
    <circle cx="1066" cy="268" r="21" fill="#fff" opacity=".22"/><path d="M1066 253v15l11 7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="1100" y="269" font-size="18" font-weight="700" fill="#fff">Evaluate in order</text>
    <text x="1052" y="310" font-size="14" fill="#eaf8ff">Check each rule from 0 downward.</text>
    <text x="1052" y="333" font-size="14" fill="#eaf8ff">Run the first one that matches.</text>
    <rect x="1020" y="386" width="306" height="164" rx="24" fill="#fff"/>
    <circle cx="1066" cy="431" r="20" fill="#dcfce7"/><path d="m1057 431 7 7 13-15" fill="none" stroke="#24924b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1100" y="428" font-size="17" font-weight="700">One active decision</text>
    <text x="1052" y="472" font-size="14" fill="#64748b">Higher priority rules can pause</text>
    <text x="1052" y="494" font-size="14" fill="#64748b">lower priority activity when needed.</text>
    <rect x="1020" y="578" width="306" height="124" rx="24" fill="#fff"/>
    <rect x="1046" y="601" width="54" height="8" rx="4" fill="#e65c5c"/><rect x="1108" y="601" width="54" height="8" rx="4" fill="#f59e0b"/><rect x="1170" y="601" width="54" height="8" rx="4" fill="#169bd5"/><rect x="1232" y="601" width="54" height="8" rx="4" fill="#45b765"/>
    <text x="1046" y="644" font-size="13" font-weight="600" fill="#475569">Safety</text><text x="1110" y="644" font-size="13" font-weight="600" fill="#475569">Manual</text><text x="1172" y="644" font-size="13" font-weight="600" fill="#475569">Routine</text><text x="1234" y="644" font-size="13" font-weight="600" fill="#475569">Pool</text>
    <text x="1046" y="675" font-size="13" fill="#94a3b8">Priority groups</text>
  </g>
  <text x="84" y="752" class="small">POOLSMART  ·  CONTROL LOGIC</text>
  <text x="1326" y="752" text-anchor="end" class="small">0 = highest priority</text>
</svg>
