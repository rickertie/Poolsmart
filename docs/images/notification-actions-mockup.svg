<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- PLACEHOLDER SVG — Replace with AI-generated image from VISUAL_ASSETS_RECOMMENDATIONS.md -->
<svg
   version="1.1"
   id="svg-notification-actions-mockup"
   width="420"
   height="520"
   viewBox="0 0 420 520"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">

  <title>Actionable Notification Mockup — Placeholder</title>
  <desc>Mobile phone showing a Home Assistant companion-app push notification with two action buttons. See VISUAL_ASSETS_RECOMMENDATIONS.md for AI generation prompt.</desc>

  <defs>
    <filter id="notif-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="420" height="520" fill="#FAFAFA"/>

  <!-- phone body -->
  <g filter="url(#notif-shadow)">
    <rect x="60" y="20" width="300" height="480" rx="36" fill="#263238"/>
    <rect x="72" y="34" width="276" height="452" rx="24" fill="#ECEFF1"/>
    <rect x="160" y="24" width="100" height="14" rx="7" fill="#263238"/>
  </g>

  <!-- status bar -->
  <text x="90" y="60" font-family="Inter, Roboto, system-ui, sans-serif" font-size="12" font-weight="700" fill="#37474F">9:41</text>
  <text x="330" y="60" font-family="Inter, Roboto, system-ui, sans-serif" font-size="12" font-weight="700" fill="#37474F" text-anchor="end">100%</text>

  <!-- notification card -->
  <g transform="translate(84, 90)" filter="url(#notif-shadow)">
    <rect x="0" y="0" width="252" height="160" rx="18" fill="#FFFFFF"/>
    <circle cx="30" cy="32" r="16" fill="#00ACC1"/>
    <text x="30" y="37" font-family="Inter, Roboto, system-ui, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle">🏊</text>
    <text x="54" y="28" font-family="Inter, Roboto, system-ui, sans-serif" font-size="11" font-weight="700" fill="#607D8B">POOLSMART</text>
    <text x="54" y="42" font-family="Inter, Roboto, system-ui, sans-serif" font-size="10" fill="#90A4AE">now</text>
    <text x="20" y="68" font-family="Inter, Roboto, system-ui, sans-serif" font-size="14" font-weight="700" fill="#263238">Heating postponed</text>
    <text x="20" y="88" font-family="Inter, Roboto, system-ui, sans-serif" font-size="11" fill="#546E7A">Price above ceiling. Waiting for a</text>
    <text x="20" y="102" font-family="Inter, Roboto, system-ui, sans-serif" font-size="11" fill="#546E7A">cheaper hour before swim time.</text>

    <line x1="0" y1="118" x2="252" y2="118" stroke="#ECEFF1" stroke-width="1.5"/>
    <line x1="126" y1="118" x2="126" y2="160" stroke="#ECEFF1" stroke-width="1.5"/>
    <text x="63" y="144" font-family="Inter, Roboto, system-ui, sans-serif" font-size="12" font-weight="700" fill="#00ACC1" text-anchor="middle">Heat now anyway</text>
    <text x="189" y="144" font-family="Inter, Roboto, system-ui, sans-serif" font-size="12" font-weight="700" fill="#EF5350" text-anchor="middle">Do not heat today</text>
  </g>

  <text x="210" y="300" font-family="Inter, Roboto, system-ui, sans-serif" font-size="11" fill="#78909C" text-anchor="middle">Tap a button — it acts immediately,</text>
  <text x="210" y="316" font-family="Inter, Roboto, system-ui, sans-serif" font-size="11" fill="#78909C" text-anchor="middle">no need to open the app</text>

  <g transform="translate(50, 486)">
    <rect x="0" y="0" width="320" height="20" rx="4" ry="4" fill="#FFF3E0"/>
    <text x="160" y="14" font-family="Inter, Roboto, system-ui, sans-serif" font-size="9" fill="#E65100" text-anchor="middle">Placeholder — see VISUAL_ASSETS_RECOMMENDATIONS.md</text>
