record_dose:
  name: Record a dose
  description: >-
    Log a chemical dose and start circulating so it disperses. The reading before
    dosing is stored so the next water test can show what the dose achieved,
    which is how the recommendation learns this pool's own response.
    Refused when more than one PoolSmart pool is configured — multi-pool
    targeting is not yet supported.
  fields:
    product:
      name: Product
      required: true
      selector:
        select:
          options:
            - label: pH-minus (15% hydrochloric acid)
              value: acid_15
            - label: pH-minus (37% hydrochloric acid)
              value: acid_37
            - label: pH-plus (sodium carbonate)
              value: ph_plus
            - label: Chlorine granules (70%)
              value: chlorine_granules_70
            - label: Liquid chlorine (15%)
              value: chlorine_liquid_15
    amount:
      name: Amount
      required: true
      selector:
        number:
          min: 1
          max: 5000
          step: 1
          mode: box
    unit:
      name: Unit
      required: true
      selector:
        select:
          options:
            - label: millilitre
              value: ml
            - label: gram
              value: g
            - label: litre
              value: l
            - label: kilogram
              value: kg

set_setting:
  name: Change a setting
  description: >-
    Change one of the settings otherwise only reachable through Configure.
    Meant for the panel's Settings tab, where these are the values people
    adjust most often -- see issue #23. Refused when more than one
    PoolSmart pool is configured — multi-pool targeting is not yet supported.
  fields:
    key:
      name: Setting
      required: true
      selector:
        select:
          options:
            - label: Desired temperature
              value: target_temp
            - label: Maximum price for heating
              value: max_price
            - label: Solar surplus for free heating
              value: solar_threshold
            - label: House power limit
              value: power_limit
    value:
      name: Value
      required: true
      selector:
        number:
          mode: box
          step: 0.01

reset_learned:
  name: Reset one learned value
  description: >-
    Clear a single learned figure without discarding the rest. A value that has
    drifted somewhere implausible should not cost you the whole learning
    history, particularly the heat loss, which takes days of idle periods to
    rebuild. Refused when more than one PoolSmart pool is configured —
    multi-pool targeting is not yet supported.
  fields:
    value:
      name: Which value
      required: true
      selector:
        select:
          options:
            - label: Heating rate
              value: heating_rate
            - label: Heat loss (uncovered)
              value: heat_loss
            - label: Heat loss (covered)
              value: heat_loss_covered
            - label: Measured flow
              value: measured_flow
            - label: COP curve
              value: cop

export_learning:
  name: Export learned history
  description: >-
    Write the learned values, session log and dose log to a file. Useful before
    rebuilding a system, or to carry a pool's history to another Home Assistant.
    Today's quota and the current mode are deliberately left out: they describe
    a moment rather than a pool. Refused when more than one PoolSmart pool is
    configured — multi-pool targeting is not yet supported.
  fields:
    path:
      name: File path
      required: false
      example: /config/poolsmart_learning.json
      selector:
        text:
    sections:
      name: What to include
      description: Leave empty to include everything (the default).
      required: false
      selector:
        select:
          multiple: true
          options:
            - label: Learned values
              value: learned
            - label: Session log
              value: session_log
            - label: Dose log
              value: dose_log
            - label: Last water test
              value: last_water_test

import_learning:
  name: Import learned history
  description: >-
    Read a previously exported file. Values this pool has already measured for
    itself are kept, because they were measured on the actual installation.
    Refused when more than one PoolSmart pool is configured — multi-pool
    targeting is not yet supported.
  fields:
    path:
      name: File path
      required: true
      example: /config/poolsmart_learning.json
      selector:
        text:

replace_learning:
  name: Replace learned history (advanced)
  description: >-
    Overwrite learned history from a file instead of merging it. Unlike Import,
    this discards what this pool has already measured for itself in favour of
    the file — for recovering a backup exactly as it was, not routine use.
    Requires Confirm to be on. Refused when more than one PoolSmart pool is
    configured — multi-pool targeting is not yet supported.
  fields:
    path:
      name: File path
      required: true
      example: /config/poolsmart_learning.json
      selector:
        text:
    sections:
      name: What to replace
      description: Leave empty to replace everything the file contains.
      required: false
      selector:
        select:
          multiple: true
          options:
            - label: Learned values
              value: learned
            - label: Session log
              value: session_log
            - label: Dose log
              value: dose_log
            - label: Last water test
              value: last_water_test
    confirm:
      name: Confirm
      description: Must be on. This overwrites existing history and cannot be undone.
      required: true
      selector:
        boolean:

rebuild_learning:
  name: Reprocess learning history
  description: >-
    Recompute the heating rate and COP curve from the whole session log, and
    recover COP session counts. Useful after a batch of session reviews or an
    import, so the effect is immediate rather than waiting on the next session.
    Refused when more than one PoolSmart pool is configured — multi-pool
    targeting is not yet supported.

clear_debug_log:
  name: Clear debug log
  description: >-
    Empty the decision log and the near-miss tally. Diagnostic trails only —
    this never touches learned values, sessions, or doses. Refused when more
    than one PoolSmart pool is configured — multi-pool targeting is not yet
    supported.

clear_all_history:
  name: Clear all history (advanced)
  description: >-
    Permanently delete every learned value, session, dose, and log entry.
    Today's live filtration progress and current mode/target are left alone.
    Cannot be undone. Requires Confirm to be on. Refused when more than one
    PoolSmart pool is configured — multi-pool targeting is not yet supported.
  fields:
    confirm:
      name: Confirm
      description: Must be on. This permanently deletes history and cannot be undone.
      required: true
      selector:
        boolean:

set_session_review:
  name: Review a heating session
  description: >-
    Override whether one logged heating session counts toward learning. The
    automatic verdict is usually right, but it cannot know a probe glitched or
    the pool was topped up mid-session -- this is how you correct it. The
    heating rate and COP curve are recomputed immediately from every session
    that currently counts, so the correction takes effect right away rather
    than only shaping future sessions. Refused when more than one PoolSmart
    pool is configured — multi-pool targeting is not yet supported.
  fields:
    session_start:
      name: Session
      description: >-
        The session's start time, exactly as shown in the Sessions tab
        (ISO 8601, e.g. 2026-08-14T18:03:00+02:00).
      required: true
      example: "2026-08-14T18:03:00+02:00"
      selector:
        text:
    review:
      name: Review
      required: true
      selector:
        select:
          options:
            - label: Use the automatic verdict
              value: auto
            - label: Always count this session
              value: included
            - label: Never count this session
              value: excluded
