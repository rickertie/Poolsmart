name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the acceptance suite
        run: cd tests && python run_tests.py

      - name: Import every Home Assistant free module
        run: |
          cd custom_components/poolsmart
          python -c "
          import importlib, sys
          sys.path.insert(0, '.')
          for m in ('const','core.config','core.models','core.chemistry',
                    'core.learning','core.heating','core.optimizer',
                    'core.filtration','core.safety','core.ladder','core.trace'):
              importlib.import_module(m)
          print('all pure modules import')
          "
